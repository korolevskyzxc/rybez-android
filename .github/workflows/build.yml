name: Build Signed APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Generate Keystore & Build APK
        run: |
          keytool -genkeypair -v -keystore release.jks -alias rybez -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Rybez, OU=Dev, O=Dev, L=Ufa, S=RB, C=RU"
          gradle assembleRelease
      - name: Upload APK & Keystore
        uses: actions/upload-artifact@v4
        with:
          name: Rybez-Release-APK
          path: |
            app/build/outputs/apk/release/app-release.apk
            release.jks
