name: Build Signed APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: |
          echo "" | base64 -d > app/src/main/AndroidManifest.xml
          cat << 'EOF' > app/src/main/java/com/dev/rybez/MainActivity.kt
          package com.dev.rybez

          import android.annotation.SuppressLint
          import android.os.Bundle
          import android.view.View
          import android.view.WindowManager
          import android.webkit.JavascriptInterface
          import android.webkit.WebResourceRequest
          import android.webkit.WebResourceResponse
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.appcompat.app.AppCompatActivity
          import androidx.webkit.WebViewAssetLoader
          import com.yandex.mobile.ads.common.AdError
          import com.yandex.mobile.ads.common.AdRequest
          import com.yandex.mobile.ads.common.AdRequestError
          import com.yandex.mobile.ads.common.ImpressionData
          import com.yandex.mobile.ads.common.YandexAds
          import com.yandex.mobile.ads.rewarded.Reward
          import com.yandex.mobile.ads.rewarded.RewardedAd
          import com.yandex.mobile.ads.rewarded.RewardedAdEventListener
          import com.yandex.mobile.ads.rewarded.RewardedAdLoadListener
          import com.yandex.mobile.ads.rewarded.RewardedAdLoader

          class MainActivity : AppCompatActivity() {

              private lateinit var webView: WebView
              private var rewardedAd: RewardedAd? = null
              private var rewardedAdLoader: RewardedAdLoader? = null
              private val adUnitId = "R-M-20508083-1"

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  hideSystemUI()

                  rewardedAdLoader = RewardedAdLoader(this)
                  YandexAds.initialize(this) {
                      loadRewardedAd()
                  }

                  webView = WebView(this)
                  setContentView(webView)

                  val assetLoader = WebViewAssetLoader.Builder()
                      .addPathHandler("/assets/", WebViewAssetLoader.AssetsPathHandler(this))
                      .build()

                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      mediaPlaybackRequiresUserGesture = false
                  }

                  webView.webViewClient = object : WebViewClient() {
                      override fun shouldInterceptRequest(
                          view: WebView,
                          request: WebResourceRequest
                      ): WebResourceResponse? {
                          return assetLoader.shouldInterceptRequest(request.url)
                      }
                  }

                  webView.addJavascriptInterface(AndroidBridge(), "AndroidBridge")
                  webView.loadUrl("https://androidplatform.net")
              }

              private fun loadRewardedAd() {
                  val adRequest = AdRequest.Builder(adUnitId).build()
                  rewardedAdLoader?.loadAd(adRequest, object : RewardedAdLoadListener {
                      override fun onAdLoaded(ad: RewardedAd) {
                          rewardedAd = ad
                      }
                      override fun onAdFailedToLoad(error: AdRequestError) {
                          rewardedAd = null
                      }
                  })
              }

              inner class AndroidBridge {
                  @JavascriptInterface
                  fun showRewardedAd() {
                      runOnUiThread {
                          val ad = rewardedAd
                          if (ad != null) {
                              var isRewarded = false
                              ad.setAdEventListener(object : RewardedAdEventListener {
                                  override fun onAdShown() {}
                                  override fun onAdFailedToShow(adError: AdError) {
                                      rewardedAd?.setAdEventListener(null)
                                      rewardedAd = null
                                      loadRewardedAd()
                                      notifyJs(false)
                                  }
                                  override fun onAdDismissed() {
                                      rewardedAd?.setAdEventListener(null)
                                      rewardedAd = null
                                      loadRewardedAd()
                                      notifyJs(isRewarded)
                                  }
                                  override fun onAdClicked() {}
                                  override fun onAdImpression(impressionData: ImpressionData?) {}
                                  override fun onRewarded(reward: Reward) {
                                      isRewarded = true
                                  }
                              })
                              ad.show(this@MainActivity)
                          } else {
                              loadRewardedAd()
                              notifyJs(true)
                          }
                      }
                  }
              }

              private fun notifyJs(isRewarded: Boolean) {
                  webView.evaluateJavascript("window.onAndroidAdFinished($isRewarded);", null)
              }

              private fun hideSystemUI() {
                  @Suppress("DEPRECATION")
                  window.decorView.systemUiVisibility = (
                      View.SYSTEM_UI_FLAG_FULLSCREEN
                      or View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      or View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                  )
              }

              override fun onPause() {
                  super.onPause()
                  webView.onPause()
              }

              override fun onResume() {
                  super.onResume()
                  webView.onResume()
                  hideSystemUI()
              }

              override fun onDestroy() {
                  super.onDestroy()
                  rewardedAdLoader = null
                  rewardedAd?.setAdEventListener(null)
                  rewardedAd = null
              }
          }
          EOF
          keytool -genkeypair -v -keystore release.jks -alias rybez -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Rybez, OU=Dev, O=Dev, L=Ufa, S=RB, C=RU"
          gradle assembleRelease
      - name: Upload APK & Keystore
        uses: actions/upload-artifact@v4
        with:
          name: Rybez-Release-APK
          path: |
            app/build/outputs/apk/release/app-release.apk
            release.jks
