name: Build Signed APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: |
          mkdir -p app/src/main/java/com/dev/rybez
          printf '<?xml version="1.0" encoding="utf-8"?>\n<manifest xmlns:android="http://android.com">\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <application android:allowBackup="true" android:label="Rybez" android:theme="@style/Theme.AppCompat.NoActionBar" android:usesCleartextTraffic="true">\n        <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait" android:configChanges="orientation|screenSize|keyboardHidden">\n            <intent-filter>\n                <action android:name="android.intent.action.MAIN" />\n                <category android:name="android.intent.category.LAUNCHER" />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>\n' > app/src/main/AndroidManifest.xml
          cat app/src/main/AndroidManifest.xml
          keytool -genkeypair -v -keystore release.jks -alias rybez -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Rybez, OU=Dev, O=Dev, L=Ufa, S=RB, C=RU"
          gradle assembleRelease
      - name: Upload APK & Keystore
        uses: actions/upload-artifact@v4
        with:
          name: Rybez-Release-APK
          path: |
            app/build/outputs/apk/release/app-release.apk
            release.jks
