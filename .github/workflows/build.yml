name: Build Signed APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: |
          python3 -c '
          a = chr(97) + "ndroid"
          ns = "http://" + "schemas." + a + ".com/apk/res/" + a
          xml = f"""<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:{a}="{ns}">
              <uses-permission {a}:name="{a}.permission.INTERNET" />
              <uses-permission {a}:name="{a}.permission.ACCESS_NETWORK_STATE" />
              <application {a}:allowBackup="true" {a}:label="Rybez" {a}:supportsRtl="true" {a}:theme="@style/Theme.AppCompat.NoActionBar" {a}:usesCleartextTraffic="true">
                  <activity {a}:name=".MainActivity" {a}:exported="true" {a}:screenOrientation="portrait" {a}:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action {a}:name="{a}.intent.action.MAIN" />
                          <category {a}:name="{a}.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>"""
          open("app/src/main/AndroidManifest.xml", "w").write(xml)
          '
          keytool -genkeypair -v -keystore release.jks -alias rybez -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Rybez, OU=Dev, O=Dev, L=Ufa, S=RB, C=RU"
          gradle assembleRelease
      - name: Upload APK & Keystore
        uses: actions/upload-artifact@v4
        with:
          name: Rybez-Release-APK
          path: |
            app/build/outputs/apk/release/app-release.apk
            release.jks
